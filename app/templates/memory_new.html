{% extends "base.html" %}

{% block title %}Yeni Anı - 7B Anı Defteri{% endblock %}

{% block content %}
<div class="relative flex min-h-screen w-full flex-col justify-between overflow-x-hidden">
    <div class="flex-grow">
        <header class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 bg-white/80 p-4 backdrop-blur-sm">
            <a href="/memories" class="flex size-10 items-center justify-center rounded-full text-[var(--text-primary)] hover:bg-gray-100">
                <span class="material-symbols-outlined">arrow_back_ios_new</span>
            </a>
            <h1 class="text-lg font-bold text-[var(--text-primary)]">Yeni Anı</h1>
            <div class="w-10"></div>
        </header>
        
        <main class="p-4">
            <form method="post" action="/memories" class="space-y-4">
                <div>
                    <label for="author_name" class="block text-sm font-medium text-[var(--text-primary)] mb-2">Adın</label>
                    <input type="text" id="author_name" name="author_name" value="{{ current_user }}" 
                           class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]" 
                           placeholder="Adını gir..." required>
                </div>
                
                <div>
                    <label for="text" class="block text-sm font-medium text-[var(--text-primary)] mb-2">Anı Metni</label>
                    <textarea id="text" name="text" rows="4" 
                              class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]" 
                              placeholder="Anını paylaş..." required></textarea>
                </div>
                
                <div>
                    <label for="image_url" class="block text-sm font-medium text-[var(--text-primary)] mb-2">Fotoğraf URL'si (İsteğe bağlı)</label>
                    <input type="url" id="image_url" name="image_url" 
                           class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]" 
                           placeholder="https://example.com/foto.jpg">
                </div>
                
                <div class="pt-4">
                    <button type="submit" 
                            class="w-full rounded-lg bg-[var(--primary-color)] px-4 py-3 text-sm font-medium text-white hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]">
                        Anıyı Paylaş
                    </button>
                </div>
            </form>
        </main>
    </div>
</div>
{% endblock %}
